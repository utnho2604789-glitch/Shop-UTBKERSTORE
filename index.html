    <style>

        .neon-glow { text-shadow: 0 0 10px rgba(168, 85, 247, 0.7); }
        .neon-box { box-shadow: 0 0 15px rgba(168, 85, 247, 0.25); }
        .matrix-bg { background: radial-gradient(circle at center, #1e1b4b 0%, #030712 100%); }
    </style>
</head>
<body class="matrix-bg min-h-screen flex flex-col justify-between selection:bg-purple-500 selection:text-white pb-24">

        function renderNavbar() {
            const nav = document.getElementById('navbar-menu');

            nav.innerHTML = `

                <button onclick="switchTab('mua-acc')" class="nav-btn px-2 py-1.5 rounded font-orbitron text-[10px] font-bold flex flex-col items-center justify-center ${currentTab === 'mua-acc' ? 'bg-purple-600 text-white neon-box' : 'bg-gray-800/80 text-gray-300'}"><i class="fa-solid fa-id-card mb-0.5"></i><span>MUA ACC</span></button>

                ${isAdmin ? `

        function switchTab(tabId) {
            currentTab = tabId;

        function renderHeaderAuth() {
            const headerAuth = document.getElementById('auth-header-section');

        function renderContent() {
            renderNavbar();
            renderHeaderAuth();
            const main = document.getElementById('main-content');
            if (!main) return;

            if (currentTab === 'mua-key' || currentTab === 'mua-acc') {
                const typeFilter = currentTab === 'mua-key' ? 'key' : 'acc';
                const filtered = products.filter(p => p.type === typeFilter);

                main.innerHTML = `

                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                        ${filtered.map(p => `

                                <div>

                                <img src="image.png" onerror="this.src='https://api.vietqr.io/image/970407-2126042009-Xq15V6T.jpg?accountName=Y%20UT%20BKRONG&amount=0&addInfo=UTBKER'" class="w-36 h-36 object-contain mx-auto">

                                <p><span class="text-gray-400">Số TK:</span> <strong class="text-pink-400 font-mono">2126042009</strong></p>

                            </div>

                        <form onsubmit="submitDeposit(event)" class="space-y-2">

                        </form>
                    </div>

                main.innerHTML = `<div class="max-w-md mx-auto cyber-border bg-gray-900/90 p-4 rounded-xl text-xs"><h2 class="text-sm font-orbitron font-bold text-center text-yellow-400 mb-3">BẢNG XẾP HẠNG TOP NẠP</h2><div class="p-2.5 bg-purple-950/40 rounded flex justify-between"><span class="text-white font-bold">1. ProPlayer99</span><span class="text-green-400 font-mono">5,200,000đ</span></div></div>`;

                let myPurchases = userPurchases.filter(x => x.username === currentUser.username);

                        <h2 class="font-orbitron font-bold text-purple-400 mb-1">TÀI KHOẢN CÁ NHÂN</h2>

                                            <p class="font-mono text-yellow-300 select-all bg-black/50 p-1.5 rounded">${item.deliverData}</p>

            } else if (currentTab === 'admin-panel') {
                if (!currentUser || currentUser.role !== 'admin') { main.innerHTML = `<div class="text-center py-10 text-red-400 text-xs">KHÔNG CÓ QUYỀN TRUY CẬP!</div>`; return; }
                main.innerHTML = `
                    <div class="max-w-xl mx-auto cyber-border bg-gray-900/90 p-4 rounded-xl text-xs space-y-3">
                        <h2 class="font-orbitron font-bold text-pink-400"><i class="fa-solid fa-shield-halved mr-1"></i>DUYỆT NẠP TIỀN KHÁCH HÀNG</h2>
                        <div class="bg-black/50 p-2.5 rounded border border-purple-900">
                            ${transactions.filter(t => t.type === 'deposit' && t.status === 'pending').length === 0 ? '<p class="text-gray-500">Không có lệnh nạp nào đang chờ.</p>' : transactions.filter(t => t.type === 'deposit' && t.status === 'pending').map(t => `<div class="flex justify-between items-center bg-gray-900 p-2 rounded mb-1"><span>${t.username} -${t.amount.toLocaleString()}đ</span><button onclick="approveDeposit('${t.id}')" class="px-2.5 py-1 bg-green-600 text-white rounded font-bold">DUYỆT</button></div>`).join('')}
                        </div>
                    </div>
                `;
            } else if (currentTab === 'edit-products') {
                if (!currentUser || currentUser.role !== 'admin') { main.innerHTML = `<div class="text-center py-10 text-red-400 text-xs">KHÔNG CÓ QUYỀN TRUY CẬP!</div>`; return; }
                main.innerHTML = `
                    <div class="max-w-3xl mx-auto cyber-border bg-gray-900/90 p-4 rounded-xl text-xs space-y-3">
                        <div class="flex justify-between items-center">
                            <h2 class="font-orbitron font-bold text-yellow-400"><i class="fa-solid fa-pen-to-square mr-1"></i>QUẢN LÝ SẢN PHẨM & GÓI THỜI GIAN</h2>
                            <button onclick="addNewProduct()" class="px-3 py-1.5 bg-purple-600 text-white rounded font-bold font-orbitron">+ THÊM SẢN PHẨM</button>
                        </div>
                        <div class="space-y-2 max-h-[450px] overflow-y-auto">
                            ${products.map(p => `
                                <div class="bg-gray-900 p-3 rounded border border-purple-900/50 space-y-2">
                                    <div class="flex justify-between items-center">
                                        <div class="flex items-center space-x-2">
                                            <img src="${p.image || ''}" class="w-9 h-9 object-cover rounded bg-black" onerror="this.src='https://via.placeholder.com/40'">

                                                <p class="text-white font-bold">${p.name}</p>
                                                <p class="text-[10px] text-gray-400">Kho: ${p.stock} \vert{} Gói: ${(p.tiers || []).map(t => `${t.duration}: ${t.price.toLocaleString()}đ`).join(', ')}</p>
                                            </div>
                                        </div>
                                        <div class="space-x-1">
                                            <button onclick="editProduct(${p.id})" class="px-2.5 py-1 bg-blue-600 text-white rounded font-bold">SỬA</button>
                                            <button onclick="deleteProduct(${p.id})" class="px-2.5 py-1 bg-red-600 text-white rounded font-bold">XÓA</button>
                                        </div>
                                    </div>
                                    <div class="bg-black/50 p-2 rounded border border-purple-900/30">
                                        <p class="text-[10px] text-cyan-300 font-bold mb-0.5">Nội dung bàn giao (Key / File):</p>
                                        <p class="font-mono text-yellow-300">${p.deliverData || 'Chưa có'}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (currentTab === 'admin-orders') {
                if (!currentUser || currentUser.role !== 'admin') { main.innerHTML = `<div class="text-center py-10 text-red-400 text-xs">KHÔNG CÓ QUYỀN TRUY CẬP!</div>`; return; }
                main.innerHTML = `
                    <div class="max-w-3xl mx-auto cyber-border bg-gray-900/90 p-4 rounded-xl text-xs space-y-3">
                        <h2 class="font-orbitron font-bold text-cyan-400"><i class="fa-solid fa-box-archive mr-1"></i>QUẢN LÝ LỊCH SỬ MUA HÀNG TOÀN HỆ THỐNG</h2>
                        <div class="space-y-2 max-h-[450px] overflow-y-auto">
                            ${userPurchases.length === 0 ? '<p class="text-gray-500">Chưa có đơn hàng nào.</p>' : userPurchases.map(item => `
                                <div class="bg-black/60 p-3 rounded border border-purple-900/50 space-y-2">
                                    <div class="flex justify-between items-center">
                                        <div>
                                            <p class="text-white font-bold">Khách: <span class="text-cyan-400">${item.username}</span> - ${item.productName} (${item.selectedTier})</p>
                                            <p class="text-[10px] text-gray-400">Thời gian: ${item.time} \vert{} Giá: ${item.price.toLocaleString()}đ</p>
                                        </div>
                                        <button onclick="editOrderData('${item.purchaseId}')" class="px-2.5 py-1 bg-yellow-600 text-white rounded font-bold">SỬA KEY</button>
                                    </div>
                                    <div class="bg-purple-950/60 p-2 rounded border border-purple-500/40">
                                        <p class="text-[10px] font-bold text-cyan-300 mb-0.5">Bàn giao:</p>
                                        <p class="font-mono text-yellow-300">${item.deliverData}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
        }

        function buyProductWithTier(productId) {
            if (!currentUser) { alert('Vui lòng đăng nhập!'); openAuthModal('login'); return; }
            let p = products.find(x => x.id === productId);
            if (!p) return;

            let selectEl = document.getElementById(`tier-select-${productId}`);
            let tierIdx = selectEl ? parseInt(selectEl.value) : 0;
            let selectedTierObj = p.tiers[tierIdx] || { duration: 'Mặc định', price: 50000 };

            if (currentUser.balance < selectedTierObj.price) { 
                alert('Số dư ví không đủ, vui lòng nạp thêm tiền!'); 
                switchTab('nap-tien'); 
                return; 
            }
            if (p.stock <= 0) { alert('Sản phẩm đã hết hàng!'); return; }
            
            currentUser.balance -= selectedTierObj.price;
            p.stock -= 1;
            
            let purchaseItem = {
                purchaseId: 'PUR-' + Date.now(),
                username: currentUser.username,
                productName: p.name,
                selectedTier: selectedTierObj.duration,
                price: selectedTierObj.price,
                deliverData: p.deliverData || 'Đang cập nhật',
                time: new Date().toLocaleString()
            };
            userPurchases.unshift(purchaseItem);

            transactions.push({ id: 'TX-'+Date.now(), username: currentUser.username, type: 'buy', amount: selectedTierObj.price, details: `Mua ${p.name} (${selectedTierObj.duration})`, status: 'success' });
            saveLocalData();
            renderContent();
            alert(`Thanh toán thành công gói ${selectedTierObj.duration}! Xem Key/File bàn giao tại mục CÁ NHÂN.`);
        }

        function submitDeposit(e) {
            e.preventDefault();
            if (!currentUser) { alert('Vui lòng đăng nhập!'); openAuthModal('login'); return; }
            let amt = parseInt(document.getElementById('deposit-amount').value);
            transactions.push({ id: 'TX-'+Date.now(), username: currentUser.username, type: 'deposit', amount: amt, details: 'Nạp Techcombank', status: 'pending' });
            saveLocalData();
            alert('Đã gửi yêu cầu nạp tiền!');
            switchTab('tai-khoan');
        }

        function approveDeposit(txId) {
            let tx = transactions.find(x => x.id === txId);
            if (tx) { 
                tx.status = 'approved'; 
                let targetUser = registeredUsers.find(u => u.username === tx.username);
                if(targetUser) {
                    targetUser.balance += tx.amount;
                    if(currentUser && currentUser.username === targetUser.username) {
                        currentUser.balance = targetUser.balance;
                    }
                }
                saveLocalData(); 
                renderContent(); 
                alert('Đã duyệt cộng tiền thành công!'); 
            }
        }

        function editProduct(id) {
            let p = products.find(x => x.id === id);
            if (!p) return;
            p.name = prompt('Sửa Tên sản phẩm:', p.name) || p.name;
            p.stock = parseInt(prompt('Sửa Số lượng kho:', p.stock)) || p.stock;
            p.note = prompt('Sửa Ghi chú:', p.note || '') || '';
            p.image = prompt('Sửa Link Hình ảnh (URL):', p.image || '') || '';
            p.deliverData = prompt('Sửa nội dung bàn giao (Key / Link file):', p.deliverData || '') || '';
            
            let price1Day = prompt('Nhập giá Gói 1 Ngày (bỏ trống nếu không có):', '');
            let price1Week = prompt('Nhập giá Gói 1 Tuần (bỏ trống nếu không có):', '');
            let price1Month = prompt('Nhập giá Gói 1 Tháng (bỏ trống nếu không có):', '');

            let newTiers = [];
            if(price1Day) newTiers.push({ duration: '1 Ngày', price: parseInt(price1Day) });
            if(price1Week) newTiers.push({ duration: '1 Tuần', price: parseInt(price1Week) });
            if(price1Month) newTiers.push({ duration: '1 Tháng', price: parseInt(price1Month) });
            if(newTiers.length > 0) p.tiers = newTiers;

            saveLocalData();
            renderContent();
            alert('Đã cập nhật sản phẩm thành công!');
        }

        function deleteProduct(id) {
            products = products.filter(x => x.id !== id);
            saveLocalData();
            renderContent();
            alert('Đã xóa sản phẩm!');
        }

        function addNewProduct() {
            let name = prompt('Nhập tên sản phẩm mới:');
            if (!name) return;
            let stock = parseInt(prompt('Số lượng tồn kho:', '10')) || 10;
            let note = prompt('Ghi chú sản phẩm:', 'Bản VIP') || '';
            let image = prompt('Link hình ảnh (URL):', 'https://images.unsplash.com/photo-1542751371-adc38448a05e?w=500&auto=format&fit=crop') || '';
            let deliverData = prompt('Nhập nội dung bàn giao (Key / Link tải):', 'KEY-VIP-EXAMPLE') || '';
            
            let price1Day = prompt('Giá Gói 1 Ngày (đ):', '10000');
            let price1Week = prompt('Giá Gói 1 Tuần (đ):', '30000');
            let price1Month = prompt('Giá Gói 1 Tháng (đ):', '50000');

            let tiers = [];
            if(price1Day) tiers.push({ duration: '1 Ngày', price: parseInt(price1Day) });
            if(price1Week) tiers.push({ duration: '1 Tuần', price: parseInt(price1Week) });
            if(price1Month) tiers.push({ duration: '1 Tháng', price: parseInt(price1Month) });
            if(tiers.length === 0) tiers.push({ duration: 'Vĩnh viễn', price: 50000 });

            products.push({ id: Date.now(), name, type: 'key', stock, note, image, tiers, deliverData });
            saveLocalData();
            renderContent();
            alert('Đã thêm sản phẩm thành công!');
        }

        function editOrderData(purchaseId) {
            let item = userPurchases.find(x => x.purchaseId === purchaseId);
            if (!item) return;
            let newData = prompt('Chỉnh sửa nội dung bàn giao cho khách:', item.deliverData);
            if (newData !== null) {
                item.deliverData = newData;
                saveLocalData();
                renderContent();
                alert('Đã cập nhật thành công!');
            }
        }

        function openAuthModal(mode) {
            let title = mode === 'login' ? 'ĐĂNG NHẬP HỆ THỐNG' : 'ĐĂNG KÝ TÀI KHOẢN MỚI';
            let formContent = mode === 'login' ? `
                <input type="text" id="login-username" required placeholder="Tên đăng nhập" class="w-full bg-black/50 border border-purple-900 rounded px-2.5 py-1.5 text-white text-xs">
                <input type="password" id="login-password" required placeholder="Mật khẩu" class="w-full bg-black/50 border border-purple-900 rounded px-2.5 py-1.5 text-white text-xs">
            ` : `
                <input type="text" id="reg-displayname" required placeholder="Tên hiển thị" class="w-full bg-black/50 border border-purple-900 rounded px-2.5 py-1.5 text-white text-xs">
                <input type="text" id="reg-username" required placeholder="Tên đăng nhập" class="w-full bg-black/50 border border-purple-900 rounded px-2.5 py-1.5 text-white text-xs">
                <input type="password" id="reg-password" required placeholder="Mật khẩu" class="w-full bg-black/50 border border-purple-900 rounded px-2.5 py-1.5 text-white text-xs">
                <input type="email" id="reg-gmail" required placeholder="Địa chỉ Gmail" class="w-full bg-black/50 border border-purple-900 rounded px-2.5 py-1.5 text-white text-xs">
            `;

            let html = `
                <div id="auth-modal" class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
                    <div class="cyber-border bg-gray-900 w-full max-w-xs p-4 rounded-xl relative">
                        <button onclick="document.getElementById('auth-modal').remove()" class="absolute top-2 right-2 text-gray-400"><i class="fa-solid fa-xmark"></i></button>
                        <h3 class="text-xs font-orbitron font-bold text-purple-400 mb-3 text-center">${title}</h3>
                        <form onsubmit="handleAuth(event, '${mode}')" class="space-y-2">
                            ${formContent}
                            <button type="submit" class="w-full py-2 bg-purple-600 text-white rounded font-orbitron text-xs font-bold mt-1">${mode === 'login' ? 'ĐĂNG NHẬP' : 'HOÀN TẤT ĐĂNG KÝ'}</button>
                        </form>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', html);
        }

        function handleAuth(e, mode) {
            e.preventDefault();
            if (mode === 'login') {
                let u = document.getElementById('login-username').value.trim();
                let p = document.getElementById('login-password').value.trim();
                let found = registeredUsers.find(x => x.username === u && x.password === p);
                if (found) {
                    currentUser = found;
                    saveLocalData();
                    renderContent();
                    document.getElementById('auth-modal').remove();
                    alert('Đăng nhập thành công!');
                } else {
                    alert('Sai tên đăng nhập hoặc mật khẩu!');
                }
            } else {
                let displayName = document.getElementById('reg-displayname').value.trim();
                let username = document.getElementById('reg-username').value.trim();
                let password = document.getElementById('reg-password').value.trim();
                let gmail = document.getElementById('reg-gmail').value.trim();

                if (registeredUsers.some(x => x.username === username)) {
                    alert('Tên đăng nhập này đã tồn tại!');
                    return;
                }

                let newUser = { username, password, displayName, gmail, balance: 0, role: 'user' };
                registeredUsers.push(newUser);
                currentUser = newUser;
                saveLocalData();
                document.getElementById('auth-modal').remove();
                renderContent();
                alert('Đăng ký tài khoản thành công!');
            }
        }

        function logout() { currentUser = null; saveLocalData(); switchTab('mua-key'); alert('Đã đăng xuất!'); }

        renderContent();
    </script>
</body>
</html>
